id: speedmap

requirements:
  - name: ecoscope-platform
    version: ">=2.25.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: pydeck
    version: "0.9.2"
    channel: conda-forge

rjsf-overrides:
  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name
      - const: subject_subtype
        title: Subject Subtype
      - const: subject_sex
        title: Subject Sex

    # Speedmap's per-bucket, per-group series are often short and sparse
    # (e.g. a subject tracked for only a few months) - lower these from the
    # library-wide defaults (tuned for longer series) so GAM/GAMM fit
    # reliably out of the box. Raise them per-run for longer time series.
    GamSplineSettings.properties.degree_of_freedom.default: 3
    GamSplineSettings.properties.degree.default: 2
    GammSplineSettings.properties.degree_of_freedom.default: 3

  properties:
    Subject Group.properties.subject_obs.properties.subject_group_name.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_client_name.properties.data_source.properties.name

    Group Data.properties.groupers.properties.groupers.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client_name.properties.data_source.properties.name
    Group Data.properties.groupers.properties.groupers.items.anyOf:
      - $ref: "#/$defs/ValueGrouper"
    Group Data.properties.groupers.properties.groupers.default:
      - index_name: subject_name

    time_range.properties.since.default: "2008-01-01T00:00:00.000Z"
    time_range.properties.since.description: Start of the movement analysis period.
    time_range.properties.until.description: End of the movement analysis period.

    Trend Analysis.properties.trend_bucket.properties.var.title: Trend Time Bucket
    Trend Analysis.properties.trend_bucket.properties.var.description: >-
      Time period to bucket for the mean-speed trend chart. Use a shorter
      bucket (Day or Week) for subjects tracked over only a short period -
      Month can be too coarse to produce enough data points for the trend
      fit in that case.
    Trend Analysis.properties.trend_bucket.properties.var.default: "%Y-%m"
    Trend Analysis.properties.trend_bucket.properties.var.oneOf:
      - const: "%Y-%m-%d"
        title: Day
      - const: "%Y-%W"
        title: Week
      - const: "%Y-%m"
        title: Month
      - const: "%Y"
        title: Year

    Dashboard.properties.map_widget_title.properties.var.title: Map Title
    Dashboard.properties.map_widget_title.properties.var.default: Subject Speed Map
    Dashboard.properties.map_widget_title.properties.var.description: >-
      Title displayed on the speed map.

    Dashboard.properties.chart_widget_title.properties.var.title: Trend Chart Title
    Dashboard.properties.chart_widget_title.properties.var.default: Mean Speed Trend Chart
    Dashboard.properties.chart_widget_title.properties.var.description: >-
      Title displayed on the mean speed trend chart.
  uiSchema:
    # Hide each variant's own redundant fieldset title (repeats what the
    # Trend Model dropdown itself already shows selected), each wrapper
    # field's own title so only the inner field's normal-sized label shows,
    # and the variant's own `model` const field entirely - it's a fixed,
    # non-editable value that just repeats the dropdown selection.
    # Positional, matching TrendModel's union order: LinearTrendModel,
    # GlmTrendModel, GamTrendModel, GammTrendModel (see
    # wt-hansen-deforestation's spec.yaml for the same pattern).
    Trend Analysis.trend_model.model.anyOf:
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        intercept_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        family_settings:
          ui:options:
            label: false
        intercept_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        family_settings:
          ui:options:
            label: false
        smoothing_settings:
          ui:options:
            label: false
        spline_settings:
          ui:options:
            label: false
        bounds_settings:
          ui:options:
            label: false
      - ui:options:
          label: false
        model:
          ui:widget: hidden
        family_settings:
          ui:options:
            label: false
        spline_settings:
          ui:options:
            label: false
        mcmc_settings:
          ui:options:
            label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - title: Subject Group
    type: task-group
    description: Choose the EarthRanger subject group to map and analyze.
    tasks:
      - name: ""
        id: subject_obs
        task: get_subjectgroup_observations
        partial:
          client: ${{ workflow.er_client_name.return }}
          time_range: ${{ workflow.time_range.return }}
          raise_on_empty: false
          include_details: false
          include_subjectsource_details: false
          filter: clean

  - name: Convert to timezone
    id: convert_to_user_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.subject_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - fixtime

  - title: Group Data
    type: task-group
    description: Optionally group the data by subject, time period, or spatial feature group.
    tasks:
      - id: groupers
        task: set_groupers

      - id: spatial_group_ids
        task: extract_spatial_grouper_feature_group_names
        partial:
          groupers: ${{ workflow.groupers.return }}

      - id: fetch_spatial_feature_groups
        task: get_spatial_features_group
        partial:
          client: ${{ workflow.er_client_name.return }}
        map:
          argnames: spatial_features_group_name
          argvalues: ${{ workflow.spatial_group_ids.return }}

      - id: resolved_groupers
        task: resolve_spatial_feature_groups_for_spatial_groupers
        partial:
          groupers: ${{ workflow.groupers.return }}
          spatial_feature_groups: ${{ workflow.fetch_spatial_feature_groups.return }}

  - name: Transform Observations to Relocations
    id: subject_reloc
    task: process_relocations
    partial:
      observations: ${{ workflow.convert_to_user_timezone.return }}
      relocs_columns:
        - groupby_col
        - fixtime
        - junk_status
        - geometry
        - extra__subject__name
        - extra__subject__subject_subtype
        - extra__subject__sex
      filter_point_coords:
        - x: 180.000000
          y: 90.000000
        - x: 0.000000
          y: 0.000000
        - x: 1.000000
          y: 1.000000

  - name: Convert Relocations to Trajectory
    id: subject_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.subject_reloc.return }}

  - name: ""
    id: traj_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.subject_traj.return }}
      time_col: segment_start
      groupers: ${{ workflow.resolved_groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: ""
    id: traj_add_spatial_index
    task: add_spatial_index
    partial:
      gdf: ${{ workflow.traj_add_temporal_index.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: ""
    id: rename_traj_columns
    task: map_columns
    partial:
      df: ${{ workflow.traj_add_spatial_index.return }}
      drop_columns: []
      retain_columns: []
      rename_columns:
        extra__name: subject_name
        extra__subject_subtype: subject_subtype
        extra__sex: subject_sex
      raise_if_not_found: true

  - name: ""
    id: classify_traj_speed
    task: apply_classification
    partial:
      df: ${{ workflow.rename_traj_columns.return }}
      input_column_name: speed_kmhr
      output_column_name: speed_bins
      classification_options:
        scheme: equal_interval
        k: 6
      label_options:
        label_ranges: true
        label_decimals: 1
        label_suffix: " km/h"

  - name: ""
    id: split_subject_traj_groups
    task: split_groups
    partial:
      df: ${{ workflow.classify_traj_speed.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Base Maps
    id: base_map_defs
    task: set_base_maps

  - name: ""
    id: sort_traj_speed
    task: sort_values
    partial:
      column_name: speed_bins
      ascending: true
      na_position: last
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_subject_traj_groups.return }}

  - name: ""
    id: colormap_traj_speed
    task: apply_color_map
    partial:
      input_column_name: speed_bins
      output_column_name: speed_bins_colormap
      colormap:
        - "#1a9850"
        - "#91cf60"
        - "#d9ef8b"
        - "#fee08b"
        - "#fc8d59"
        - "#d73027"
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.sort_traj_speed.return }}

  - name: ""
    id: traj_map_layers
    task: create_path_layer
    partial:
      data_url: null
      layer_style:
        get_color: speed_bins_colormap
      legend:
        title: Speed
        label_column: speed_bins
        color_column: speed_bins_colormap
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.colormap_traj_speed.return }}

  - name: ""
    id: traj_ecomap
    task: draw_map
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      legend_style:
        placement: bottom-right
      static: false
      output_type: "html"
      title: null
      max_zoom: 20
      view_state: null
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.traj_map_layers.return }}

  - name: ""
    id: ecomap_html_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.traj_ecomap.return }}

  - title: Trend Analysis
    type: task-group
    description: >-
      Choose a trend model and configure its fitting parameters for mean
      speed over time.
    tasks:
      - name: ""
        id: trend_bucket
        task: set_string_var

      - name: ""
        id: trend_bucket_column
        task: concat_string_vars
        partial:
          values:
            - "TemporalGrouper_"
            - ${{ workflow.trend_bucket.return }}

      - name: ""
        id: traj_add_month_index
        task: add_temporal_index
        partial:
          time_col: segment_start
          groupers:
            - temporal_index: ${{ workflow.trend_bucket.return }}
          cast_to_datetime: true
          format: mixed
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.split_subject_traj_groups.return }}

      # Tag each already-split group's rows with a literal "name" column
      # (whatever the active Group Data grouper's own column is called) -
      # the convention fit_trend_model/predict_trend_model use to derive
      # GAMM's per-site random effect below. A no-op when ungrouped.
      - name: ""
        id: traj_named_for_trend
        task: rename_value_grouper_columns_to_name
        partial:
          groupers: ${{ workflow.resolved_groupers.return }}
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.traj_add_month_index.return }}

      - name: ""
        id: trend_groupby_cols
        task: trend_groupby_columns
        partial:
          bucket_column: ${{ workflow.trend_bucket_column.return }}
          groupers: ${{ workflow.resolved_groupers.return }}

      - name: ""
        id: speed_trends
        task: summarize_df
        partial:
          summary_params:
            - display_name: mean_speed_kmhr
              aggregator: mean
              column: speed_kmhr
            - display_name: period_start
              aggregator: min
              column: segment_start
              decimal_places: null
          groupby_cols: ${{ workflow.trend_groupby_cols.return }}
          reset_index: true
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.traj_named_for_trend.return }}

      - name: ""
        id: persist_speed_trend_data
        task: persist_df_wrapper
        skipif:
          conditions:
            - never
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          sanitize: true
          filename_prefix: speed_trends
          filetypes:
            - parquet
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.speed_trends.return }}

      - name: ""
        id: trend_model
        task: set_trend_model

      # GAMM fits once across every group's combined data (a real random
      # effect needs multiple groups in one fit; see GammTrendModel's own
      # docstring), unlike the other 3 models which each fit independently
      # per group - so it gets its own combined-fit branch below, gated by
      # is_gamm_trend_model/is_not_gamm_trend_model so exactly one of the
      # two fit branches actually runs for any given model selection. Both
      # branches' resulting per-group predictions (trend_predictions /
      # trend_predictions_gamm) are then merged back into one series per
      # group via trend_predictions_merged/_final, so everything downstream
      # (chart, persist, widget) is unaware of the branching. See
      # wt-hansen-deforestation's spec.yaml for the same pattern applied to
      # forest regions instead of subject groups.
      - name: ""
        id: trend_fit
        task: fit_trend_model
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - is_gamm_trend_model
        partial:
          time_column: period_start
          value_column: mean_speed_kmhr
          model: ${{ workflow.trend_model.return }}
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.speed_trends.return }}

      - name: ""
        id: trend_predictions
        task: predict_trend_model
        partial:
          time_column: "time"
          value_column: "value"
          time_values: null
          include_ci: true
        mapvalues:
          argnames: model_params
          argvalues: ${{ workflow.trend_fit.return }}

      - name: ""
        id: speed_trends_combined
        task: concat_dataframes
        partial:
          dfs: ${{ workflow.speed_trends.return }}
          ensure_columns: ["period_start", "mean_speed_kmhr", "name"]
          reset_index: true

      - name: ""
        id: trend_fit_combined
        task: fit_trend_model
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - is_not_gamm_trend_model
        partial:
          dataframe: ${{ workflow.speed_trends_combined.return }}
          time_column: period_start
          value_column: mean_speed_kmhr
          model: ${{ workflow.trend_model.return }}

      - name: ""
        id: trend_predictions_gamm
        task: predict_trend_model
        partial:
          model_params: ${{ workflow.trend_fit_combined.return }}
          time_column: period_start
          value_column: mean_speed_kmhr
          time_values: null
          include_ci: true
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.speed_trends.return }}

      # The raw output of the underlying statsmodels (Linear/GLM/GAM) or
      # pymc/bambi (GAMM) fit - one row per model parameter, with a
      # coefficient/std error/p-value/CI for the former or a posterior
      # mean/sd/hdi/r_hat for the latter. Rendered as its own dashboard
      # table (download built in via table_config.enable_download, so no
      # separate raw-CSV persist is needed) - same is_gamm_trend_model/
      # is_not_gamm_trend_model gating as the fit branches above: exactly
      # one of trend_fit_summary (per group)/trend_fit_summary_combined (the
      # one shared GAMM fit) produces real output for any given selection.
      - name: ""
        id: trend_fit_summary
        task: get_trend_model_fit_summary
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - is_gamm_trend_model
        partial:
          model: ${{ workflow.trend_model.return }}
        mapvalues:
          argnames: model_params
          argvalues: ${{ workflow.trend_fit.return }}

      - name: ""
        id: trend_fit_summary_table
        task: draw_table
        partial:
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: false
            enable_download: true
            hide_header: false
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.trend_fit_summary.return }}

      - name: ""
        id: persist_trend_fit_summary_table
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.trend_fit_summary_table.return }}

      - name: ""
        id: trend_fit_summary_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Trend Model Fit Parameters"
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.persist_trend_fit_summary_table.return }}

      - name: ""
        id: grouped_trend_fit_summary
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.trend_fit_summary_widget.return }}

      # GAMM's combined fit is shared across every group - a single table,
      # shown regardless of which group is selected (view: null), rather
      # than forced per-group like the branch above.
      - name: ""
        id: trend_fit_summary_combined
        task: get_trend_model_fit_summary
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - is_not_gamm_trend_model
        partial:
          model_params: ${{ workflow.trend_fit_combined.return }}
          model: ${{ workflow.trend_model.return }}

      - name: ""
        id: trend_fit_summary_table_gamm
        task: draw_table
        partial:
          dataframe: ${{ workflow.trend_fit_summary_combined.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: false
            enable_download: true
            hide_header: false

      - name: ""
        id: persist_fit_summary_table_gamm
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          text: ${{ workflow.trend_fit_summary_table_gamm.return }}

      - name: ""
        id: fit_summary_widget_gamm
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Trend Model Fit Parameters"
          view: null
          data: ${{ workflow.persist_fit_summary_table_gamm.return }}

      - name: ""
        id: trend_predictions_merged
        task: groupbykey_passthrough_skip
        partial:
          iterables:
            - ${{ workflow.trend_predictions.return }}
            - ${{ workflow.trend_predictions_gamm.return }}

      - name: ""
        id: trend_predictions_final
        task: concat_dataframes
        partial:
          ensure_columns: []
          reset_index: true
        mapvalues:
          argnames: dfs
          argvalues: ${{ workflow.trend_predictions_merged.return }}

      - name: ""
        id: trend_time_cast
        task: add_temporal_index
        partial:
          groupers: {}
          time_col: time
          cast_to_datetime: true
          format: mixed
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.trend_predictions_final.return }}

      - name: ""
        id: persist_trend_data
        task: persist_df_wrapper
        skipif:
          conditions:
            - never
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          sanitize: true
          filename_prefix: trend_predictions
          filetypes:
            - parquet
        mapvalues:
          argnames: df
          argvalues: ${{ workflow.trend_time_cast.return }}

      - name: Trend Chart
        id: speed_trend_chart
        task: draw_historic_timeseries
        partial:
          current_value_column: y
          time_column: time
          current_value_title: Observed Mean Speed
          historic_min_column: ci_lower
          historic_max_column: ci_upper
          historic_mean_column: predicted
          historic_mean_title: Trend Estimate
          historic_band_title: Trend Confidence
          layout_style:
            xaxis:
              title: Time
            yaxis:
              title: Mean Speed (km/h)
          upper_lower_band_style:
            mode: lines
            line:
              color: green
          historic_mean_style: null
          current_value_style: null
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.trend_time_cast.return }}

      - name: ""
        id: persist_speed_trend_chart
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.speed_trend_chart.return }}

  - title: Dashboard
    type: task-group
    description: Configure the dashboard output titles.
    tasks:
      - name: ""
        id: map_widget_title
        task: set_string_var

      - name: ""
        id: chart_widget_title
        task: set_string_var

  - name: ""
    id: speed_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.map_widget_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.ecomap_html_urls.return }}

  - name: ""
    id: grouped_speed_map
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.speed_map_widget.return }}

  - name: ""
    id: speed_trend_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.chart_widget_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.persist_speed_trend_chart.return }}

  - name: ""
    id: grouped_speed_trend
    task: merge_widget_views
    skipif:
      conditions:
        - never
    partial:
      widgets: ${{ workflow.speed_trend_widget.return }}

  - name: ""
    id: speedmap_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      time_range: ${{ workflow.time_range.return }}
      widgets:
        - ${{ workflow.grouped_speed_map.return }}
        - ${{ workflow.grouped_speed_trend.return }}
        - ${{ workflow.grouped_trend_fit_summary.return }}
        - ${{ workflow.fit_summary_widget_gamm.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
