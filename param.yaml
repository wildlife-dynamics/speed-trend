workflow_details:
  name: Speedmap with GAMM Trends
  description: >-
    Speed-classified elephant movement map and GAMM trend analysis of mean
    walking speed over time.

er_client_name:
  data_source:
    name: "EarthRanger"

subject_obs:
  subject_group_name: "Elephants"

groupers:
  groupers: []

time_range:
  since: "2008-01-01T00:00:00Z"
  until: "2009-12-31T23:59:59Z"

base_map_defs:
  base_maps:
    - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
      opacity: 1.0
    - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      opacity: 0.5
      max_zoom: 17

gamm_model:
  degree: 2
  degree_of_freedom: 3

map_widget_title:
  title: Subject Speed Map

chart_widget_title:
  title: Mean Speed Trend Chart
